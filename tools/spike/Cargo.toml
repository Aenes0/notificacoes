[package]
name = "spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false
description = "Spike de risco da Tarefa 1 (descartável): camada, nome no D-Bus, texto"

# Workspace vazio: este crate não entra no crate principal do daemon.
[workspace]

[dependencies]
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
dbus = "0.9.12"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
